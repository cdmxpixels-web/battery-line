plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.walkman.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.walkman.remote"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

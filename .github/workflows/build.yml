name: Build Battery Line APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Source Code
        run: |
          mkdir -p app/src/main/java/com/walkman/batteryline

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BatteryLine"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.walkman.batteryline'
              compileSdk 34

              defaultConfig {
                  applicationId "com.walkman.batteryline"
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:label="Battery Line"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BatteryService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/walkman/batteryline/MainActivity.kt
          package com.walkman.batteryline

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivityForResult(intent, 100)
                  } else {
                      startService()
                      finish()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (Settings.canDrawOverlays(this)) {
                      startService()
                  }
                  finish()
              }

              private fun startService() {
                  startForegroundService(Intent(this, BatteryService::class.java))
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/walkman/batteryline/BatteryService.kt
          package com.walkman.batteryline

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.IBinder
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager

          class BatteryService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var lineView: BatteryLineView

              private val batteryReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      intent?.let {
                          val level = it.getIntExtra(BatteryManager.EXTRA_LEVEL, -1)
                          val scale = it.getIntExtra(BatteryManager.EXTRA_SCALE, -1)
                          if (level >= 0 && scale > 0) {
                              val percent = (level * 100) / scale
                              lineView.updateBattery(percent)
                          }
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  lineView = BatteryLineView(this)

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      2,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 0
                      y = 0
                  }

                  windowManager.addView(lineView, params)
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED), Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(batteryReceiver, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  unregisterReceiver(batteryReceiver)
                  windowManager.removeView(lineView)
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun startAsForeground() {
                  val channelId = "battery_line_channel"
                  val channel = NotificationChannel(
                      channelId,
                      "Battery Line",
                      NotificationManager.IMPORTANCE_MIN
                  )
                  val manager = getSystemService(NotificationManager::class.java)
                  manager.createNotificationChannel(channel)

                  val notification = Notification.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_charging)
                      .setContentTitle("")
                      .build()

                  startForeground(1, notification)
              }

              private class BatteryLineView(context: Context) : View(context) {
                  private var batteryPercent: Int = 100
                  private val paint = Paint()

                  fun updateBattery(percent: Int) {
                      batteryPercent = percent
                      postInvalidate()
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      val currentWidth = width * (batteryPercent / 100f)
                      paint.color = when {
                          batteryPercent > 20 -> Color.WHITE
                          batteryPercent > 10 -> Color.YELLOW
                          else -> Color.RED
                      }
                      canvas.drawRect(0f, 0f, currentWidth, height.toFloat(), paint)
                  }
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: battery-line-apk
          path: app/build/outputs/apk/debug/app-debug.apk
